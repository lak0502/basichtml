<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPL</title>
  <style>
    table {
      border-collapse: collapse; /* รวมเส้นขอบให้เป็นเส้นเดียว ไม่ซ้อนกันเป็นบล็อก */
    }
    th, td {
      border: 1px solid black; /* กำหนดเส้นขอบให้แต่ละช่อง */
      padding: 8px; /* เพิ่มระยะห่างขอบในช่องให้อ่านง่าย (ลบออกได้ถ้าไม่ต้องการ) */
    }
  </style>
</head>
<body>
  <h3>Clubs in EPL</h3>
  <hr>
  <table>
    <thead>
      <tr>
        <th>No</th>
        <th>Name</th>
        <th>City</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>Arsenal</td>
        <td>London</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Manchester City</td>
        <td>Manchester</td>
      </tr>
      <tr>
        <td>3</td>
        <td>Chelsea</td>
        <td>London</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
