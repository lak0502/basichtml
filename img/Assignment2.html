<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Form</title>
</head>
<body>
  <h3 style="text-align: center;">แบบสอบถาม</h3>
  <hr>

  <form action="#" method="post">
    <table align="center" style="background-color: #e0f2fe; padding: 10px;">
      <tr>
        <td colspan="2"><b>ข้อมูลผู้ตอบแบบสอบถาม</b></td>
      </tr>
      <tr>
        <td><b>ชื่อ-นามสกุล</b></td>
        <td><input type="text" name="fullname" size="40"></td>
      </tr>
      <tr>
        <td><b>รหัสนักศึกษา</b></td>
        <td><input type="text" name="student_id" size="40"></td>
      </tr>
      <tr>
        <td><b>เพศ</b></td>
        <td>
          <input type="radio" name="gender" value="male" checked> ชาย
          <input type="radio" name="gender" value="female"> หญิง
        </td>
      </tr>
      <tr>
        <td><b>สังกัดคณะ</b></td>
        <td>
          <select name="faculty" size="11">
            <option value="science">วิทยาศาสตร์</option>
            <option value="cs">วิทยาการคอมพิวเตอร์</option>
            <option value="education">ครุศาสตร์</option>
            <option value="business">บริหารธุรกิจและการจัดการ</option>
            <option value="humanities">มนุษยศาสตร์</option>
            <option value="industrial">เทคโนโลยีอุตสาหกรรม</option>
            <option value="agriculture">เกษตรศาสตร์</option>
            <option value="nursing">พยาบาลศาสตร์</option>
            <option value="public_health">สาธารณสุขศาสตร์</option>
            <option value="thai_medicine">แพทย์แผนไทยและทางเลือก</option>
            <option value="law">นิติศาสตร์</option>
          </select>
        </td>
      </tr>
      <tr>
        <td colspan="2"><b>แม่สีที่ชื่นชอบ</b></td>
      </tr>
      <tr>
        <td colspan="2">
          <input type="checkbox" name="color" value="red"> สีแดง
          <input type="checkbox" name="color" value="green"> สีเขียว
          <input type="checkbox" name="color" value="blue"> สีน้ำเงิน
        </td>
      </tr>
      <tr>
        <td colspan="2"><b>ผลไม้ที่ชื่นชอบ</b></td>
      </tr>
      <tr>
        <td colspan="2">
          <input type="checkbox" name="fruit" value="strawberry"> สตรอว์เบอร์รี
          <input type="checkbox" name="fruit" value="mangosteen"> มังคุด
          <input type="checkbox" name="fruit" value="orange"> ส้ม <br>
          <input type="checkbox" name="fruit" value="grape"> องุ่น
          <input type="checkbox" name="fruit" value="pineapple"> สับปะรด
          <input type="checkbox" name="fruit" value="apple"> แอปเปิล
        </td>
      </tr>
      <tr>
        <td colspan="2"><b>อาหารที่ชื่นชอบ</b></td>
      </tr>
      <tr>
        <td colspan="2">
          <input type="checkbox" name="food" value="krapao"> กะเพราหมูกรอบ
          <input type="checkbox" name="food" value="somtam"> ส้มตำไทย
          <input type="checkbox" name="food" value="khaomangai"> ข้าวมันไก่ <br>
          <input type="checkbox" name="food" value="shabu"> ชาบู
          <input type="checkbox" name="food" value="friedrice"> ข้าวผัดปู
          <input type="checkbox" name="food" value="ramen"> ราเมน
        </td>
      </tr>
      <tr>
        <td colspan="2" align="center">
          <input type="submit" value="บันทึก">
        </td>
      </tr>
    </table>
  </form>
</body>
</html>
